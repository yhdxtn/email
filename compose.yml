name: astrogate-mail-admin
services:
  postgres:
    image: postgres:17.11-bookworm
    entrypoint: ["/bin/sh", "/opt/astrogate/postgres-secrets-entrypoint.sh"]
    command: ["postgres"]
    tmpfs: ["/run/astrogate-init:rw,noexec,nosuid,size=1m"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: astrogate
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets: [postgres-password, database-password, migration-password]
    volumes:
      - control-db:/var/lib/postgresql/data
      - ./deploy/postgres-secrets-entrypoint.sh:/opt/astrogate/postgres-secrets-entrypoint.sh:ro
      - ./deploy/postgres-init.sh:/docker-entrypoint-initdb.d/10-control-users.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d astrogate"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [control]
    mem_limit: 512m
    shm_size: 128m
    security_opt: [no-new-privileges:true]
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    user: "${CONTROL_UID:-10001}:${CONTROL_GID:-10001}"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LOCAL_DEV: ${LOCAL_DEV:-false}
      APP_ORIGIN: ${APP_ORIGIN:-https://admin.example.test}
      ADMIN_TRUSTED_PROXY_CIDRS: ${ADMIN_TRUSTED_PROXY_CIDRS:-}
      APP_MASTER_KEY_FILE: /run/secrets/master-key
      APP_SETUP_TOKEN_FILE: /run/secrets/setup-token
      DATABASE_URL: jdbc:postgresql://postgres:5432/astrogate
      DATABASE_USER: astrogate_app
      MIGRATION_USER: astrogate_migrator
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD_FILE: /run/secrets/smtp-password
      SMTP_ALLOWED_FROM: ${SMTP_ALLOWED_FROM:-}
      TEST_RECIPIENTS: ${TEST_RECIPIENTS:-}
      FORWARD_ALLOWED_DOMAINS: ${FORWARD_ALLOWED_DOMAINS:-}
      AGENT_URL: ${AGENT_URL:-}
      AGENT_INSTANCE_ID: ${AGENT_INSTANCE_ID:-}
      AGENT_SIGNING_KEY_FILE: /run/secrets/agent-signing-key
      AGENT_CLIENT_KEYSTORE: /run/agent-pki/client.p12
      AGENT_TRUSTSTORE: /run/agent-pki/trust.p12
      AGENT_KEYSTORE_PASSWORD_FILE: /run/secrets/agent-keystore-password
    secrets: [database-password, migration-password, master-key, setup-token, smtp-password, agent-signing-key, agent-keystore-password]
    volumes:
      - ./secrets/agent-client:/run/agent-pki:ro
    networks: [control, egress]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 640m
    pids_limit: 150
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on: [backend]
    # Not public HTTP. Existing Nginx or another trusted edge MUST terminate HTTPS in production.
    ports: ["127.0.0.1:8088:8080"]
    # The static UI needs a publishable gateway for the host's loopback-only HTTPS edge.
    # It has no secrets; PostgreSQL remains isolated on the internal control network.
    networks: [egress, control]
    read_only: true
    tmpfs:
      - "/tmp:rw,noexec,nosuid,size=16m"
      - "/config:rw,noexec,nosuid,size=16m,uid=10001,gid=10001"
      - "/data:rw,noexec,nosuid,size=16m,uid=10001,gid=10001"
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    pids_limit: 100
networks:
  control:
    internal: true
  egress: {}
volumes:
  control-db: {}
secrets:
  postgres-password:
    file: ./secrets/postgres-password
  database-password:
    file: ./secrets/database-password
  migration-password:
    file: ./secrets/migration-password
  master-key:
    file: ./secrets/master-key
  setup-token:
    file: ./secrets/setup-token
  smtp-password:
    file: ./secrets/smtp-password
  agent-signing-key:
    file: ./secrets/agent-signing-key
  agent-keystore-password:
    file: ./secrets/agent-keystore-password
