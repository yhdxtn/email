[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"
[project]
name = "astrogate-mail-agent"
version = "0.1.0"
description = "Read-only-first, fixed-RPC Astrogate mail node agent"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["cryptography==46.0.4"]
[project.scripts]
astrogate-mail-agent = "agent.server:main"
[tool.setuptools]
packages = ["agent"]
