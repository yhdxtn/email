server:
  port: 8080
  forward-headers-strategy: none
  error:
    include-message: never
    include-stacktrace: never
  tomcat:
    max-http-form-post-size: 5MB
    max-swallow-size: 5MB
admin:
  trusted-proxy-cidrs: ${ADMIN_TRUSTED_PROXY_CIDRS:}
spring:
  application:
    name: astrogate-mail-admin
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/astrogate}
    username: ${DATABASE_USER:astrogate}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: 8
  flyway:
    enabled: true
    user: ${MIGRATION_USER:${DATABASE_USER:astrogate_app}}
    password: ${MIGRATION_PASSWORD:${DATABASE_PASSWORD:}}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 3MB
  main:
    banner-mode: off
logging:
  level:
    root: WARN
    sbs.astrogate.mail: INFO
    org.springframework.jdbc: WARN
springdoc:
  api-docs:
    path: /api/v1/openapi
  swagger-ui:
    enabled: false
